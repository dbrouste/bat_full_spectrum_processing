name: Reassignment-v2 modelling regression
on:
  push:
    branches: [Reassignment-v2]
  pull_request:
    branches: [Reassignment-v2]
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy soundfile librosa shapely pandas 'pytest>=8,<10'
      - name: Test lightweight model parity, FFT and DP fast paths
        run: |
          python -m pytest -q tests/test_fast_modelling.py tests/test_reassignment_fastpaths.py tests/test_chirp_union.py tests/test_snr_benchmark.py
